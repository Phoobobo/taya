name: coding-small
description: Default coding task. One executor implements it; an independent reviewer verifies it before submission.
stages:
  - name: implementing
    agent: executor
    success_message: implementation.ready
    terminal: false
  - name: review
    agent: reviewer
    output: .taya/review.md
    success_message: review.approved
    retry_message: review.changes_requested
    retry_to: implementing
    terminal: false
  - name: submit
    agent: executor
    success_message: mr.created
    terminal: false
  - name: ci
    agent: assistant
    success_message: ci.passed
    retry_message: ci.failed
    retry_to: implementing
    terminal: false
  - name: merged
    agent: assistant
    success_message: task.completed
    terminal: true
